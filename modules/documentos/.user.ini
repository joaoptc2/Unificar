; ═══════════════════════════════════════════════════════════════════════════
;  Configurações PHP — Hostinger / PHP 8+
;  Este arquivo é processado a cada 5min por padrão. Se mudar algo e não
;  surtir efeito, aguarde ou reinicie o PHP-FPM via hPanel.
; ═══════════════════════════════════════════════════════════════════════════

; Upload
upload_max_filesize = 50M
post_max_size       = 55M
max_file_uploads    = 10

; Execução
memory_limit        = 256M
max_execution_time  = 60
max_input_time      = 60

; Sessão (reforço além do que session.php configura)
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly  = 1
session.cookie_samesite  = Lax
session.gc_maxlifetime   = 3600

; OPcache — ganho expressivo de performance
opcache.enable               = 1
opcache.enable_cli           = 0
opcache.memory_consumption   = 64
opcache.max_accelerated_files = 10000
opcache.revalidate_freq      = 60
opcache.validate_timestamps  = 1

; Segurança
expose_php          = Off
allow_url_fopen     = On
allow_url_include   = Off

; Uploads de arquivos grandes
default_socket_timeout = 60
